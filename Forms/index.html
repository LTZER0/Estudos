<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularios</title>
</head>
<body>
    <form action="" method="get">
        <h4>Qual area voce quer atuar</h4>
        <label for="nome">Usuario: </label>
        <input type="text" name="nome" id="nome" required>

        <label for="area">Area: </label>

        <input type="radio" name="area" id="areaweb" value="web" required> 
        <label for="areaweb">Web</label>

        <input type="radio" name="area" id="areaapp" value="app" required>
        <label for="areaapp">App</label>

        <input type="radio" name="area" id="areasoft" value="Software" required>
        <label for="areasoft">Software</label>

        <button type="submit">Enviar</button>
    </form>
</body>
</html>
