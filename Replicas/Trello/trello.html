<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Trello</title>
</head>
<body>
    <form action="" method="get">
        <div class="tituloeicone">
            <img src="img/trello.png" alt="Trelo" id="imgtrelo">
            <h1>Trello</h1>
        </div>

        <h3>Entre para continuar</h3>

        <label for="email">E-mail*</label>
        <input type="email" name="email" id="email" placeholder="Insira seu e-mail">

        <div id="checkboxtext">
            <input type="checkbox" name="contconect" id="contconect">
            <label for="contconect">Continuar Conectado</label>
        </div>

        <button type="submit" id="submit">Continuar</button>

        <p>Ou entrar com:</p>
        <button><img src="img/Chave.png" alt="chave">Passkey</button>

        <p>Ou prossiga com: </p>

        <button><img src="img/google-logo.jpg" alt="Google">Google</button>
        <button><img src="img/microsoft.png" alt="Microsoft">Microsoft</button>
        <button><img src="img/appleicon.png" alt="Apple">Apple</button>
        <button><img src="img/500px-Slack_icon_2019.svg.webp" alt="Slack">Slack</button>
    </form>
</body>
</html>
